name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # numpy for the Python tests; soundfile and imageio-ffmpeg (an ffmpeg with libmp3lame) so the
      # integration test runs the real mix and encode path with stub voices instead of skipping.
      - name: Install Python packages
        run: python -m pip install numpy==2.2.6 soundfile==0.14.0 imageio-ffmpeg==0.8.1
      - name: Unit tests
        run: ./podcast test
